{% extends "base.html" %}
{% block title %}Iniciar sesión - Sistema de Tickets de IT{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-card">
        <h1>Sistema de Tickets de IT</h1>
        <p class="subtitle">Inicie sesión para continuar</p>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Iniciar sesión</button>
        </form>

        <div class="demo-accounts">
            <h3>Cuentas de demostración</h3>
            <p><strong>Usuario básico:</strong> user1 / password123</p>
            <p><strong>Usuario de IT:</strong> itadmin / itpass123</p>
        </div>
    </div>
</div>
{% endblock %}
