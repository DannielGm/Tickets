{% extends "base.html" %}
{% block title %}Enviar ticket - Sistema de Tickets de TI{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <h1>Enviar un nuevo ticket de TI</h1>
        <p class="subtitle">Describa su problema y le daremos respuesta lo antes posible.</p>

        <form method="POST" action="{{ url_for('submit_ticket') }}">
            <div class="form-group">
                <label for="title">Título</label>
                <input type="text" id="title" name="title" required placeholder="Resumen breve del problema">
            </div>
            <div class="form-group">
                <label for="description">Descripción</label>
                <textarea id="description" name="description" rows="6" required placeholder="Descripción detallada del problema..."></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="priority">Prioridad</label>
                    <select id="priority" name="priority">
                        <option value="low">Baja</option>
                        <option value="medium" selected>Media</option>
                        <option value="high">Alta</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="category">Categoría</label>
                    <select id="category" name="category">
                        <option value="hardware">Hardware</option>
                        <option value="software">Software</option>
                        <option value="network">Red</option>
                        <option value="access">Accesos</option>
                        <option value="other" selected>Otro</option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <a href="{{ url_for('user_dashboard') }}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Enviar ticket</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
