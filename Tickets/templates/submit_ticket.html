{% extends "base.html" %}
{% block title %}Submit Ticket - IT Ticket System{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <h1>Submit a New IT Ticket</h1>
        <p class="subtitle">Describe your problem and we'll get back to you.</p>

        <form method="POST" action="{{ url_for('submit_ticket') }}">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required placeholder="Brief summary of the issue">
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="6" required placeholder="Detailed description of the problem..."></textarea>
            </div>
            <div class="form-actions">
                <a href="{{ url_for('user_dashboard') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Submit Ticket</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
